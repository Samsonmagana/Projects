{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Sign in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit" style="width: 100%; margin-bottom: 1.5rem;">Sign in</button>
    
    <div style="text-align: center; border-top: 1px solid var(--line); padding-top: 1.5rem;">
      <p class="muted" style="margin-bottom: 0.5rem; font-size: 0.9rem;">Don't have an account?</p>
      <a href="{{ url_for('signup') }}" class="btn" style="width: 100%; background: var(--muted);">Create a new account</a>
    </div>
  </form>
</div>
{% endblock %}
